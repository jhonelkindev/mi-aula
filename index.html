<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Aula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f9;--side:#fff;--card:#fff;--ink:#141a2e;--mut:#6a7186;--line:#e5e8ef;--soft:#f0f2f7;--pri:#4f46e5;--pri-2:#4338ca;--on-pri:#fff;--pri-soft:#eeefff;--danger:#d92550;--paper:#fff;--desk:#eceef3;--shadow:0 1px 2px rgba(20,26,46,.05),0 8px 24px rgba(20,26,46,.06);--r:14px}
:root[data-theme=dark]{--bg:#0d1017;--side:#12161f;--card:#161b27;--ink:#e9ecf5;--mut:#8d96ac;--line:#242a39;--soft:#1d2332;--pri:#8f90ff;--pri-2:#a9aaff;--on-pri:#0d1017;--pri-soft:#22264d;--danger:#ff6b88;--paper:#161b27;--desk:#0a0c12;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h3{font-size:1.1rem;font-weight:700}
.mut{color:var(--mut)}.sm{font-size:.82rem}
.ic{flex:none;display:block}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.end{justify-content:flex-end}

/* botones */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:600;font-size:.88rem;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--soft)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--on-pri);box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 30%,transparent)}
.btn.primary:hover{background:var(--pri-2);border-color:var(--pri-2)}
.btn.danger{color:var(--danger)}.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn[disabled]{opacity:.6;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border:0;background:none;border-radius:8px;color:var(--mut);flex:none}
.icon-btn:hover{background:var(--soft);color:var(--ink)}.icon-btn.danger:hover{color:var(--danger)}

/* estructura */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;letter-spacing:-.01em;padding:2px 6px 16px}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#ec4899);color:#fff}
.sem-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:9px 12px;margin-bottom:14px}
.sem-btn:hover{border-color:var(--pri)}
.sem-btn small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}
.sem-btn b{display:block;font-weight:700}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;font-weight:600;color:var(--mut);margin-bottom:2px}
.nav-i span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i:hover{background:var(--soft);color:var(--ink)}
.nav-i.on{background:var(--pri-soft);color:var(--pri)}
.side-h{display:flex;align-items:center;justify-content:space-between;margin:18px 6px 6px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--mut)}
.side-subs{flex:1;overflow:auto;min-height:40px}
.side-empty{padding:6px 10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.quota{font-size:.74rem;padding:0 6px 10px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:3px}
.me{display:flex;align-items:center;gap:8px;padding:0 2px}
.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-weight:800;font-size:.85rem;flex:none}
.email{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;color:var(--mut)}
.main{min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh}
.demo{background:#fff3bf;color:#5c4400;padding:6px 16px;font-size:.8rem;text-align:center;font-weight:600}
.mbar{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--side);border-bottom:1px solid var(--line)}
.content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.pad{padding:30px 34px 48px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--pri);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.scrim{display:none}

/* calendario */
.today-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.82rem;font-weight:600}
.pill .dot{width:8px;height:8px}
.cal-wrap{overflow:auto}
.cal{min-width:fit-content}
.cal-head,.cal-body{display:grid;grid-template-columns:58px repeat(var(--n),minmax(104px,1fr))}
.cal-head{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:3;border-radius:var(--r) var(--r) 0 0}
.cal-corner,.cal-times{position:sticky;left:0;background:var(--card);z-index:2}
.cal-dh{padding:12px 8px;text-align:center;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);border-left:1px solid var(--line)}
.cal-dh.today{color:var(--pri)}
.cal-dh.today span{background:var(--pri-soft);padding:4px 10px;border-radius:999px}
.cal-times div{height:var(--hh);position:relative}
.cal-times span{position:absolute;top:-8px;right:8px;font-size:.7rem;color:var(--mut);font-weight:600;white-space:nowrap}
.cal-times div:first-child span{top:2px}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh);cursor:cell}
.cal-col.today{background-color:color-mix(in srgb,var(--pri) 4%,transparent)}
.ev{position:absolute;padding:2px;border:0;background:none;text-align:left;z-index:1}
.ev>div{height:100%;border-radius:9px;padding:6px 9px;overflow:hidden;background:color-mix(in srgb,var(--c) 15%,var(--card));border-left:4px solid var(--c);color:color-mix(in srgb,var(--c) 62%,var(--ink));transition:transform .12s,box-shadow .12s}
.ev:hover>div{transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 28%,transparent)}
.ev b{display:block;font-size:.82rem;line-height:1.25;font-weight:700}
.ev span{display:block;font-size:.72rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ef4444}
.hint{margin-top:12px}
.callout{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 20px;margin-bottom:18px;background:var(--pri-soft);border:1px dashed color-mix(in srgb,var(--pri) 45%,transparent);border-radius:var(--r)}

/* materia */
.subj-head{padding:26px 34px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,var(--bg)),var(--bg));border-bottom:1px solid var(--line)}
.subj-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.subj-head .eyebrow{color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600}
.chip.tint{background:color-mix(in srgb,var(--c) 12%,var(--card));border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.tabs{display:flex;gap:4px}
.tabs button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:10px 14px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;font-size:.9rem}
.tabs button.on{color:var(--ink);border-color:var(--c,var(--pri))}

/* bloc de notas */
.nb{flex:1;min-height:420px;display:grid;grid-template-columns:288px minmax(0,1fr)}
.nb.top{border-top:1px solid var(--line)}
.nb-list{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nb-tools{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.nb-tools input{margin:0}
#nlist{flex:1;overflow:auto;padding:8px}
.nb-item{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;margin-bottom:2px}
.nb-item:hover{background:var(--soft)}
.nb-item.on{background:var(--pri-soft)}
.nb-item .t{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-item.on .t{color:var(--pri)}
.nb-edit{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--desk)}
.ed-bar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.ed-bar .tb{min-width:30px;height:30px;padding:0 7px;border:0;background:none;border-radius:7px;font-weight:700;color:var(--mut);display:inline-grid;place-items:center;font-size:.85rem}
.ed-bar .tb:hover{background:var(--soft);color:var(--ink)}
.ed-bar .sep{width:1px;height:20px;background:var(--line);margin:0 5px}
.ed-bar .grow{flex:1}
#saved{font-size:.76rem;color:var(--mut);margin-right:6px;white-space:nowrap}
.back-m{display:none}
.paper-wrap{flex:1;overflow:auto;padding:28px 16px 90px}
.paper{max-width:820px;min-height:1040px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:64px 76px 90px}
.doc-title{display:block;width:100%;border:0;background:none;outline:0;font-size:1.9rem;font-weight:800;letter-spacing:-.02em;padding:0;margin:0 0 4px}
.doc-meta{font-size:.78rem;color:var(--mut);margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.doc{outline:0;min-height:600px;font-size:1rem;line-height:1.7;overflow-wrap:anywhere}
.doc:empty::before{content:attr(data-ph);color:var(--mut)}
.doc p{margin:0 0 .7em}.doc h1{font-size:1.5rem;margin:1em 0 .4em}.doc h2{font-size:1.2rem;font-weight:700;margin:1em 0 .4em}
.doc ul,.doc ol{margin:0 0 .7em;padding-left:1.6em}
.doc blockquote{margin:0 0 .7em;padding:6px 16px;border-left:4px solid var(--pri);background:var(--soft);border-radius:0 8px 8px 0}
.doc a{color:var(--pri)}
.doc img{max-width:100%;height:auto;border-radius:6px;display:block;margin:10px 0;cursor:pointer}
.doc img[data-w="25"]{width:25%}.doc img[data-w="50"]{width:50%}.doc img[data-w="75"]{width:75%}.doc img[data-w="100"]{width:100%}
.doc img.sel{outline:3px solid var(--pri);outline-offset:2px}
.doc table{border-collapse:collapse;width:100%;margin:10px 0;table-layout:fixed}
.doc td,.doc th{border:1px solid var(--line);padding:7px 10px;vertical-align:top;min-width:40px}
.doc tr:first-child td{background:var(--soft);font-weight:700}
.doc [style*="background-color"]{color:#1a1a1a;border-radius:3px}
.empty{display:grid;place-items:center;text-align:center;color:var(--mut);padding:40px 20px;gap:10px}
.empty .big{width:56px;height:56px;border-radius:16px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;margin:0 auto 6px}
.nb-edit>.empty{flex:1}
#imgbar{position:fixed;display:none;gap:2px;background:var(--ink);padding:4px;border-radius:9px;z-index:30;box-shadow:var(--shadow)}
#imgbar button{border:0;background:none;color:var(--bg);font-weight:700;font-size:.76rem;padding:5px 8px;border-radius:6px}
#imgbar button:hover{background:rgba(128,128,128,.35)}

/* documentos */
.docs{flex:1;padding:22px 34px 60px}
.docs.drag{outline:3px dashed var(--pri);outline-offset:-10px;background:var(--pri-soft)}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-weight:700}
.crumbs button{border:0;background:none;padding:4px 8px;border-radius:7px;font-weight:700;color:var(--mut)}
.crumbs button:hover{background:var(--soft);color:var(--ink)}
.crumbs button:last-of-type{color:var(--ink)}
.folders{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-bottom:20px}
.folder .sm{white-space:nowrap}
.folder{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.folder:hover{border-color:var(--pri)}
.folder .fi{color:#f59e0b}
.folder .grow,.file .grow{flex:1;min-width:0}
.folder b,.file b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.folder .acts,.file .acts{display:flex;opacity:.55}
.folder:hover .acts,.file:hover .acts{opacity:1}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 8px 9px 12px;cursor:pointer}
.file:hover{border-color:var(--pri)}
.badge{font-size:.66rem;font-weight:800;width:42px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--mut);letter-spacing:.03em}
.badge.r{background:#fee2e2;color:#b91c1c}.badge.b{background:#dbeafe;color:#1d4ed8}.badge.g{background:#dcfce7;color:#15803d}.badge.o{background:#ffedd5;color:#c2410c}.badge.p{background:#f3e8ff;color:#7e22ce}
.drop-hint{border:2px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--mut)}

/* pendientes */
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.home-side{padding:14px;position:sticky;top:0}
.hs-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:1rem}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:10px 8px 10px 12px;margin-bottom:6px}
.task.red{border-left-color:var(--danger)}.task.amber{border-left-color:#f59e0b}
.task .grow{flex:1;min-width:0;cursor:pointer}
.task b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done b{text-decoration:line-through;color:var(--mut)}
.tmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.tmeta .dot{width:8px;height:8px}
.ttype{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--mut)}
.ttype.parcial{background:#fee2e2;color:#b91c1c}.ttype.entrega{background:#dbeafe;color:#1d4ed8}.ttype.expo{background:#f3e8ff;color:#7e22ce}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--mut);background:none;display:grid;place-items:center;flex:none;color:#fff;padding:0}
.chk:hover{border-color:var(--pri)}
.task.done .chk{background:#16a34a;border-color:#16a34a}
.due{font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--mut)}
.due.red{color:var(--danger)}.due.amber{color:#d97706}
.task .acts{display:flex}
.task.compact{padding:9px 10px;align-items:flex-start}
.task.compact .chk{margin-top:2px}
.task.compact .due{display:block;margin-top:3px}
.cal-due{border-bottom:1px solid var(--line)}
.cal-due .cal-corner{display:grid;place-items:center;color:var(--mut)}
.due-cell{border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.duechip{border:0;border-radius:6px;padding:3px 7px;font-size:.72rem;font-weight:700;text-align:left;background:#fef3c7;color:#92400e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duechip.ex{background:#fee2e2;color:#b91c1c}
.badge-n{margin-left:auto;background:var(--pri);color:var(--on-pri);font-size:.7rem;font-weight:800;border-radius:999px;padding:1px 7px;flex:none}
.badge-n.red{background:var(--danger);color:#fff}
.pill.red{border-color:var(--danger);color:var(--danger)}
.grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--mut);margin:22px 0 8px}
.grp:first-child{margin-top:0}
.grp.red{color:var(--danger)}
.tasks-wrap{max-width:880px}
.mbar .bell{margin-left:auto;position:relative}
.mbar .bell .badge-n{position:absolute;top:-2px;right:-6px;font-size:.6rem;padding:0 5px}
@media (max-width:1180px){.home{grid-template-columns:minmax(0,1fr)}.home-side{order:-1;position:static}.home-side .task:nth-of-type(n+5){display:none}}

/* formularios y diálogos */
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:12px}
input[type=text],input[type=email],input[type=password],input[type=time],input[type=search],input[type=date],textarea,select{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:500}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:24px;width:min(440px,calc(100vw - 28px));box-shadow:0 24px 70px rgba(0,0,0,.3)}
dialog.wide{width:min(620px,calc(100vw - 28px))}
dialog::backdrop{background:rgba(10,12,20,.55);backdrop-filter:blur(3px)}
dialog h3{margin-bottom:16px}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.swatches{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}
.swatches label{margin:0}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:28px;height:28px;border-radius:50%;background:var(--c);cursor:pointer;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.fs-title{font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:6px}
.slot{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 30px;gap:6px;align-items:center;margin-bottom:6px}
.slot select,.slot input{margin:0;padding:8px 8px}
.dfoot{margin-top:20px}
.sem{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px;margin-bottom:8px}
.sem.on{border-color:var(--pri);background:var(--pri-soft)}
.sem-pick{flex:1;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.sem-pick b{display:block}

/* acceso */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{background:linear-gradient(140deg,#4338ca,#7c3aed 55%,#db2777);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.auth-art h1{font-size:2.5rem;max-width:12em}
.auth-art ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;font-weight:600;opacity:.95}
.auth-art li{display:flex;gap:10px;align-items:center}
.auth-art .brand{padding:0;font-size:1.25rem}
.auth-art .logo{background:rgba(255,255,255,.2)}
.auth-form{display:grid;place-items:center;padding:32px 20px}
.auth-form form{width:min(360px,100%)}

/* ---------- capa de datos: Supabase real o memoria (demo) ---------- */
function supabaseBackend(sb) {
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const st = () => sb.storage.from(BUCKET);
  return {
    async session() { return ok(await sb.auth.getSession()).session?.user || null; },
    async signIn(email, password) { return ok(await sb.auth.signInWithPassword({ email, password })).user; },
    async signUp(email, password) { const d = ok(await sb.auth.signUp({ email, password })); return d.session ? d.user : null; },
    async signOut() { await sb.auth.signOut(); },
    async setPref(k, v) { ok(await sb.auth.updateUser({ data: { [k]: v } })); },
    async list(t, cols) { return ok(await sb.from(t).select(cols || '*').order('created_at')); },
    async get(t, id) { return ok(await sb.from(t).select('*').eq('id', id).single()); },
    async insert(t, row) { return ok(await sb.from(t).insert(row).select().single()); },
    async insertMany(t, rows) { return rows.length ? ok(await sb.from(t).insert(rows).select()) : []; },
    async update(t, id, patch) { return ok(await sb.from(t).update(patch).eq('id', id).select().single()); },
    async remove(t, id) { ok(await sb.from(t).delete().eq('id', id)); },
    async removeBy(t, col, val) { ok(await sb.from(t).delete().eq(col, val)); },
    async upload(path, file) { ok(await st().upload(path, file, { contentType: file.type || 'application/octet-stream' })); },
    async url(path) { return ok(await st().createSignedUrl(path, 3600)).signedUrl; },
    async removeFiles(paths) { if (paths.length) ok(await st().remove(paths)); },
    async removePrefix(prefix) { const l = ok(await st().list(prefix, { limit: 1000 })); if (l && l.length) ok(await st().remove(l.map(o => prefix + '/' + o.name))); }
  };
}
function memoryBackend() {
  const db = { semesters: [], subjects: [], schedule: [], notes: [], folders: [], files: [], tasks: [] }, blobs = {};

  const n = dayDiff(t.due_date), dt = new Date(t.due_date + 'T00:00');
  const txt = n < 0 ? `Atrasado ${-n} día${n < -1 ? 's' : ''}` : n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n < 7 ? `${dt.toLocaleDateString('es-CO', { weekday: 'long' })} · en ${n} días` : dt.toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' });
  return { txt: txt.charAt(0).toUpperCase() + txt.slice(1) + (t.due_time ? ' · ' + fmtT(t.due_time) : ''), cls: n <= 0 ? 'red' : n <= 3 ? 'amber' : '' };
}

const sortNotes = l => [...l].sort((a, b) => String(b.updated_at || b.created_at).localeCompare(String(a.updated_at || a.created_at)));
function defaultSemName() {
  const last = S.semesters[S.semesters.length - 1], m = last && /^(\d{4})-([12])$/.exec(last.name);

async function loadAll() {
  const [se, su, sc, no, fo, fi, ta] = await Promise.all([api.list('semesters'), api.list('subjects'), api.list('schedule'), api.list('notes', NOTE_COLS), api.list('folders'), api.list('files'), api.list('tasks')]);
  const old = new Map(S.notes.filter(n => n.content !== undefined).map(n => [n.id, n.content]));
  if (!DEMO) no.forEach(n => { if (old.has(n.id)) n.content = old.get(n.id); });
  Object.assign(S, { semesters: se, subjects: su, schedule: sc, notes: no, folders: fo, files: fi, tasks: ta });
  if (!S.semesters.length) S.semesters.push(await api.insert('semesters', { name: defaultSemName() }));
  for (const s of S.subjects.filter(s => !s.semester_id)) Object.assign(s, await api.update('subjects', s.id, { semester_id: S.semesters[0].id }));

}

/* --- horario tipo calendario --- */
function layoutDay(list) {
  const ev = list.map(c => ({ c, s: mins(c.start_time), e: mins(c.end_time) })).sort((a, b) => a.s - b.s || a.e - b.e), out = [];
  let group = [], end = -1;
  const flush = () => { const n = Math.max(...group.map(g => g.col)) + 1; group.forEach(g => g.cols = n); out.push(...group); group = []; };
  for (const e of ev) {
    if (group.length && e.s >= end) flush();
    const used = group.filter(g => g.e > e.s).map(g => g.col); let col = 0; while (used.includes(col)) col++;
    e.col = col; group.push(e); end = Math.max(end, e.e);
  }
  if (group.length) flush();
  return out;
}
function taskRow(t, compact) {

  return `<div class="task ${t.done ? 'done' : di.cls} ${compact ? 'compact' : ''}"><button class="chk" data-a="toggleTask" data-id="${t.id}" title="${t.done ? 'Marcar como pendiente' : 'Marcar como hecho'}">${t.done ? ic('check', 14) : ''}</button>

    ${compact ? '' : `<span class="due ${di.cls}">${esc(di.txt)}</span><span class="acts">${t.due_date && !t.done ? `<a class="icon-btn" href="${esc(gcalUrl(t))}" target="_blank" rel="noopener" title="Crear recordatorio en Google Calendar">${ic('bell', 15)}</a>` : ''}<button class="icon-btn danger" data-a="delTask" data-id="${t.id}" title="Eliminar">${ic('trash', 15)}</button></span>`}</div>`;
}
function gcalUrl(t) {
  const s = sub(t.subject_id), d = t.due_date.replace(/-/g, ''), f = x => `${ymd(x).replace(/-/g, '')}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  let dates;
  if (t.due_time) { const a = new Date(`${t.due_date}T${hhmm(t.due_time)}`), b = new Date(a.getTime() + 36e5); dates = f(a) + '/' + f(b); }
  else { const e = new Date(t.due_date + 'T00:00'); e.setDate(e.getDate() + 1); dates = d + '/' + ymd(e).replace(/-/g, ''); }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(`${TYPES[t.type] || 'Pendiente'}: ${t.title}${s ? ' (' + s.name + ')' : ''}`) + '&dates=' + dates + '&details=' + encodeURIComponent(t.notes || '');
}
function vHorario() {

    ${u.now ? `<button class="pill red" data-a="go" data-id="pendientes">${ic('bell', 15)} ${u.now} pendiente${u.now > 1 ? 's' : ''} para hoy o atrasado${u.now > 1 ? 's' : ''}</button>` : ''}</div>`

const OKTAG = new Set('P BR B STRONG I EM U S STRIKE H1 H2 H3 UL OL LI BLOCKQUOTE A IMG TABLE TBODY THEAD TR TD TH SPAN DIV PRE CODE HR'.split(' '));
const DROPTAG = new Set('SCRIPT STYLE IFRAME OBJECT EMBED LINK META TITLE HEAD NOSCRIPT SVG MATH FORM INPUT BUTTON TEXTAREA SELECT VIDEO AUDIO'.split(' '));
function sanitize(html) {
  const doc = new DOMParser().parseFromString('<body>' + (html || ''), 'text/html');
  const walk = node => {
    for (const e of [...node.children]) {
      if (DROPTAG.has(e.tagName)) { e.remove(); continue; }
      walk(e);
      if (!OKTAG.has(e.tagName)) { e.replaceWith(...e.childNodes); continue; }
      const bg = e.style.backgroundColor, ta = e.style.textAlign;
      for (const a of [...e.attributes]) {
        const n = a.name, v = a.value.trim();
        const keep = (n === 'href' && e.tagName === 'A' && /^(https?:|mailto:)/i.test(v)) || (n === 'src' && e.tagName === 'IMG' && /^(https?:|data:image\/|blob:)/i.test(v))
          || ((n === 'data-path' || n === 'data-w') && e.tagName === 'IMG') || ((n === 'colspan' || n === 'rowspan') && /^\d+$/.test(v));
        if (!keep) e.removeAttribute(n);
      }
      const st = [bg && 'background-color:' + bg, ta && 'text-align:' + ta].filter(Boolean).join(';');
      if (st) e.setAttribute('style', st);
      if (e.tagName === 'A') { e.target = '_blank'; e.rel = 'noopener'; }
    }
  };
  walk(doc.body);
  return doc.body.innerHTML;
}
function serialize(ed) { const c = ed.cloneNode(true); c.querySelectorAll('img').forEach(i => { i.classList.remove('sel'); i.removeAttribute('class'); if (i.dataset.path) i.removeAttribute('src'); }); return c.innerHTML; }

async function shrink(file, maxDim = 2200, minSize = 1.5 * 1048576) {   // reduce fotos grandes para ahorrar espacio
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < minSize) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const cv = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.84));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch { return file; }
}

}
const curCell = () => { const a = getSelection().anchorNode, e = a && (a.nodeType === 1 ? a : a.parentElement); const c = e && e.closest('td,th'); return c && c.closest('#ed') ? c : null; };

  // apuntes
  async newNote() {
    const sid = S.view === 'materia' ? S.subjectId : null;
    const n = await api.insert('notes', { subject_id: sid, title: sid ? `Clase del ${new Date().toLocaleDateString('es-CO', { day: 'numeric', month: 'long' })}` : '', content: '', updated_at: new Date().toISOString() });
    S.notes.push(n); S.noteId = n.id; S.q = ''; render();
  },
  openNote(id) { if (S.noteId === id) return; S.noteId = id; render(); },
  closeNote() { S.noteId = null; render(); if (matchMedia('(min-width:861px)').matches) return; },
  printNote() { window.print(); },
  async delNote(id) {
    if (!await ask('Se eliminará este apunte con sus imágenes.')) return;
    if (dirty && dirty.id === id) { dirty = null; clearTimeout(saveT); }
    edNote = null;
    await api.removePrefix(`${S.user.id}/notas/${id}`).catch(() => {}); await api.remove('notes', id);
    S.notes = S.notes.filter(n => n.id !== id); S.noteId = null; render();
  },
  imgW(w) { if (selImg) { selImg.dataset.w = w; queueSave(); showImgBar(selImg); } },
  imgDel() { if (selImg) { const i = selImg; hideImgBar(); i.remove(); queueSave(); } },
  // pendientes
  newTask() { taskForm(); },
  editTask(id) { taskForm(S.tasks.find(t => t.id === id)); },
  async toggleTask(id) { const t = S.tasks.find(x => x.id === id), done = !t.done; Object.assign(t, await api.update('tasks', id, { done, done_at: done ? new Date().toISOString() : null })); render(); if (done) toast('¡Hecho! Lo moví a completados.'); },
  async delTask(id) { const t = S.tasks.find(x => x.id === id); if (!await ask(`Se eliminará el pendiente "${t.title}".`)) return; await api.remove('tasks', id); S.tasks = S.tasks.filter(x => x.id !== id); render(); },
  // documentos
  openFolder(id) { S.folderId = id || null; render(); },
  async newFolder() { const name = await promptText('Nueva carpeta', '', 'Ej: Talleres'); if (!name) return; S.folders.push(await api.insert('folders', { subject_id: S.subjectId, parent_id: S.folderId, name })); render(); },
  async renFolder(id) { const f = S.folders.find(x => x.id === id), name = await promptText('Renombrar carpeta', f.name); if (!name) return; Object.assign(f, await api.update('folders', id, { name })); render(); },
  async delFolder(id) {
    const f = S.folders.find(x => x.id === id), ids = new Set([id]);
    for (let grew = true; grew;) { grew = false; S.folders.forEach(x => { if (ids.has(x.parent_id) && !ids.has(x.id)) { ids.add(x.id); grew = true; } }); }
    const inside = S.files.filter(x => ids.has(x.folder_id));
    if (!await ask(`Se eliminará la carpeta "${f.name}"${inside.length ? ` con ${inside.length} archivo(s)` : ''}.`)) return;
    await api.removeFiles(inside.map(x => x.path)); await api.remove('folders', id); await loadAll(); render();
  },
  async openFile(id) {
    const f = S.files.find(x => x.id === id), w = window.open('', '_blank');
    try { const u = await api.url(f.path); if (w) w.location = u; else location.href = u; }
    catch (e) { if (w) w.close(); throw e; }
  },
  async renFile(id) { const f = S.files.find(x => x.id === id), name = await promptText('Renombrar archivo', f.name); if (!name) return; Object.assign(f, await api.update('files', id, { name })); render(); },
  moveFile(id) {
    const f = S.files.find(x => x.id === id), fs = S.folders.filter(x => x.subject_id === f.subject_id).map(x => [x.id, folderPath(x).map(p => p.name).join(' / ')]).sort((a, b) => a[1].localeCompare(b[1], 'es'));
    openForm('Mover archivo', `<p class="mut sm" style="margin:-8px 0 14px">${esc(f.name)}</p><label>Carpeta de destino<select name="to"><option value="">Documentos (principal)</option>${fs.map(([i, n]) => `<option value="${i}" ${i === f.folder_id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>`,
      async d => { Object.assign(f, await api.update('files', id, { folder_id: d.to || null })); });
  },
  async delFile(id) {
    const f = S.files.find(x => x.id === id);
    if (!await ask(`Se eliminará "${f.name}".`)) return;
    await api.removeFiles([f.path]); await api.remove('files', id); S.files = S.files.filter(x => x.id !== id); render();
  }
};
document.addEventListener('click', async e => {
  const t = el(e), im = t.closest('#ed img');
  if (im) return showImgBar(im);
  if (!t.closest('#imgbar')) hideImgBar();
  const c = t.closest('[data-cmd]'); if (c) return runCmd(c.dataset.cmd, c.dataset.val).catch(err => toast(errMsg(err)));
  const node = t.closest('[data-a]'); if (!node || !A[node.dataset.a]) return;
  if (node.dataset.a !== 'slot' && node.dataset.a !== 'menu') e.stopPropagation();
  try { await A[node.dataset.a](node.dataset.id, node, e); } catch (err) { toast(errMsg(err)); }
});
document.addEventListener('mousedown', e => { if (el(e).closest('[data-cmd]')) e.preventDefault(); });
document.addEventListener('input', e => {
  const t = el(e);
  if (t.id === 'ed' || t.closest('#ed') || t.id === 'nt') queueSave();
  else if (t.id === 'nq') { S.q = t.value; $('#nlist').innerHTML = noteItems(S.view === 'materia' ? S.subjectId : null); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-upload]') && t.files.length) uploadFiles([...t.files]);
  else if (t.id === 'imgpick' && t.files.length) { insertImages([...t.files]); t.value = ''; }
});
document.addEventListener('paste', e => {
  if (!el(e).closest('#ed')) return;
  const cd = e.clipboardData, imgs = [...cd.files].filter(f => f.type.startsWith('image/'));
  if (imgs.length) { e.preventDefault(); return insertImages(imgs); }
  const html = cd.getData('text/html');
  if (html) { e.preventDefault(); document.execCommand('insertHTML', false, sanitize(html)); queueSave(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return; const cell = curCell(); if (!cell) return;
  e.preventDefault();
  let cells = [...cell.closest('table').querySelectorAll('td,th')], i = cells.indexOf(cell) + (e.shiftKey ? -1 : 1);
  if (i >= cells.length) { addRow(cell); cells = [...cell.closest('table').querySelectorAll('td,th')]; queueSave(); }
  if (i >= 0) caretIn(cells[i]);
});
document.addEventListener('dragover', e => { const t = el(e); if (t.closest('#ed') || t.closest('[data-drop]')) { e.preventDefault(); t.closest('[data-drop]')?.classList.add('drag'); } });
document.addEventListener('dragleave', e => { const z = el(e).closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drag'); });
document.addEventListener('drop', e => {
  const t = el(e), files = [...(e.dataTransfer?.files || [])]; if (!files.length) return;
  if (t.closest('#ed')) { const imgs = files.filter(f => f.type.startsWith('image/')); if (imgs.length) { e.preventDefault(); insertImages(imgs); } }
  else if (t.closest('[data-drop]')) { e.preventDefault(); uploadFiles(files); }
});
document.addEventListener('scroll', () => { if (selImg) hideImgBar(); }, true);
document.addEventListener('submit', async e => {
  if (e.target.dataset.form !== 'auth') return;
  e.preventDefault();
  const { email, password } = Object.fromEntries(new FormData(e.target)), btn = e.target.querySelector('button.primary');
  btn.disabled = true;
  try {
    if (S.authMode === 'up') {
      S.user = await api.signUp(email, password);
      if (!S.user) { toast('Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.'); S.authMode = 'in'; render(); return; }
    } else S.user = await api.signIn(email, password);
    S.prefs = { ...(S.user.user_metadata || {}) }; applyTheme();
    await loadAll(); render();
  } catch (err) { S.user = null; toast(errMsg(err)); btn.disabled = false; }
});
window.addEventListener('beforeunload', () => { if (dirty) flushSave(); });

/* ---------- arranque ---------- */
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('No se pudo cargar la librería de Supabase.')); document.head.append(s); }); }
(async () => {
  applyTheme();
  try {
    if (DEMO) api = memoryBackend();
    else { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'); api = supabaseBackend(supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY)); }
    S.user = await api.session();
    if (S.user) { S.prefs = { ...(S.user.user_metadata || {}) }; applyTheme(); await loadAll(); }
    render();
  } catch (e) { app.innerHTML = `<p style="padding:24px">No se pudo iniciar: ${esc(errMsg(e))}</p>`; }
})();
</script>
</body>
